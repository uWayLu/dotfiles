<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 專案 / Windows 常用名稱 → MS 標楷體（kaiu.ttf） -->
  <alias binding="strong">
    <family>標楷體</family>
    <prefer>
      <family>DFKai-SB</family>
      <family>全字庫正楷體</family>
      <family>TW-Kai</family>
      <family>AR PL UKai TW</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>DFKai-SB</family>
    <prefer>
      <family>DFKai-SB</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>DFKai-sb</family>
    <prefer>
      <family>DFKai-SB</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>BiauKai</family>
    <prefer>
      <family>DFKai-SB</family>
    </prefer>
  </alias>
</fontconfig>
