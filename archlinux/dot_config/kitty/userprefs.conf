# Set your personal kitty configuration here
allow_remote_control yes

# Smart paste: Ctrl+Shift+V saves clipboard images to ~/Pictures/_clipboard
# and pastes the file path; otherwise pastes text. Ctrl+V is unchanged.
#
# First clipboard read may show a kitty permission prompt (read-clipboard-ask).
# To skip prompts after you trust this workflow, uncomment the next line:
# clipboard_control write-clipboard write-primary read-clipboard read-primary
map ctrl+shift+v kitten smart_paste.py
